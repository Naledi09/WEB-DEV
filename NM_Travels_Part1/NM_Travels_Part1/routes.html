<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Routes & Schedule | NM Travels</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <div class="container nav">
                <a class="logo" href="index.html">NM <span>Travels</span></a>
                <button class="menu" aria-label="Open navigation">☰</button>
                <nav>
                    <a href="index.html">Home</a>
                    <a class="active" href="routes.html">Routes & Schedule</a>
                    <a href="booking.html">Book a Seat</a>
                    <a href="charter.html">Private Charter</a>
                    <a href="fleet.html">Fleet</a>
                    <a href="about.html">About & Contact</a>
                </nav>
            </div>
        </header>
        <main>
            <section class="banner">
                <div class="container">
                    <p class="eyebrow">Plan ahead</p>
                    <h1>Routes & Schedule</h1>
                    <p>Review sample departures, stops and prices.</p>
                </div>
            </section>
            <section class="section">
                <div class="container panel">
                    <label for="filter">Filter routes</label>
                    <select id="filter">
                        <option value="all">All</option>
                        <option value="airport">Airport</option>
                        <option value="intercity">Intercity</option>
                        <option value="commuter">Commuter</option>
                    </select>
                    <div class="table-wrap">
                        <table id="routeTable">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Route</th>
                                    <th>Departure</th>
                                    <th>Arrival</th>
                                    <th>Stops</th>
                                    <th>Price</th>
                                </tr>
                            </thead>
                            <tbody>

                            </tbody>
                        </table>

                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
